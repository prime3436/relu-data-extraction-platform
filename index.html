<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relu Consultancy | Data Extraction Engineer Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation -->
    <header class="navbar">
      <div class="nav-brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Relu Extraction Hub</h1>
          <span class="brand-badge">FTE Hiring Challenge</span>
        </div>
      </div>

      <div class="nav-center">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>171 Records Verified • 0 Null Fields • Deduplicated</span>
        </div>
      </div>

      <div class="nav-actions">
        <a id="btnDownloadCsv" class="btn btn-secondary" href="disney_cruise_results.csv" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </a>
        <button id="btnExportJson" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Export JSON
        </button>
      </div>
    </header>

    <!-- Main Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="disney">
        <span class="tab-icon">🚢</span>
        <span>Disney Cruise Line</span>
        <span class="tab-count">111</span>
      </button>
      <button class="tab-btn" data-tab="ingredients">
        <span class="tab-icon">🌿</span>
        <span>Ingredients Network</span>
        <span class="tab-count">60</span>
      </button>
      <button class="tab-btn" data-tab="insights">
        <span class="tab-icon">📊</span>
        <span>Challenge Form Answers</span>
        <span class="tab-pill">10 Answers</span>
      </button>
      <button class="tab-btn" data-tab="architecture">
        <span class="tab-icon">⚙️</span>
        <span>Architecture & Pipeline</span>
      </button>
    </div>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- KPI Highlight Cards -->
      <section id="kpiBar" class="kpi-grid">
        <!-- Rendered dynamically by app.js -->
      </section>

      <!-- Search & Filtering Toolbar -->
      <section id="toolbar" class="toolbar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search cruises, ports, suppliers, categories...">
          <button id="clearSearch" class="clear-btn">&times;</button>
        </div>

        <div class="filter-controls">
          <div class="select-wrapper" id="primaryFilterWrapper">
            <select id="primaryFilterSelect">
              <option value="">All Ships</option>
            </select>
          </div>

          <div class="select-wrapper" id="secondaryFilterWrapper">
            <select id="secondaryFilterSelect">
              <option value="">All Departure Ports</option>
            </select>
          </div>

          <div class="view-toggle">
            <button id="btnTableView" class="view-btn active" title="Table View">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
            </button>
            <button id="btnGridView" class="view-btn" title="Card Grid View">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Data Table View -->
      <section id="tableViewSection" class="table-container">
        <div class="table-meta">
          <span id="recordsCounter">Showing 111 of 111 records</span>
          <span class="sort-tip">💡 Click column headers to sort</span>
        </div>
        <div class="table-scroll">
          <table id="dataTable">
            <thead id="tableHead">
              <!-- Rendered dynamically -->
            </thead>
            <tbody id="tableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Card Grid View -->
      <section id="gridViewSection" class="cards-grid" style="display: none;">
        <!-- Rendered dynamically -->
      </section>

      <!-- Insights / Form Answers View -->
      <section id="insightsViewSection" class="insights-view" style="display: none;">
        <!-- Rendered dynamically -->
      </section>

      <!-- Architecture View -->
      <section id="architectureViewSection" class="architecture-view" style="display: none;">
        <!-- Rendered dynamically -->
      </section>

      <!-- Pagination Footer -->
      <footer id="paginationFooter" class="pagination-footer">
        <div class="pagination-info">
          <span>Rows per page:</span>
          <select id="rowsPerPageSelect">
            <option value="15">15</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="all">All</option>
          </select>
        </div>
        <div class="pagination-controls">
          <button id="btnPrevPage" class="page-btn">&larr; Previous</button>
          <span id="pageIndicator" class="page-indicator">Page 1 of 5</span>
          <button id="btnNextPage" class="page-btn">Next &rarr;</button>
        </div>
      </footer>
    </main>

    <!-- Detail Inspection Modal -->
    <div id="detailModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Record Detail</h3>
          <button id="modalClose" class="modal-close-btn">&times;</button>
        </div>
        <div id="modalBody" class="modal-body">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
